<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRK Vereinsabstimmung</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
    <style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
    --drk-red:#e30613;
    --drk-red-dark:#b70510;
    --drk-red-light:#ff2d3a;
    --white:#fff;
    --bg:#f4f4f4;
    --card:#fff;
    --text:#2a2a2a;
    --text-light:#777;
    --border:#e0e0e0;
    --success:#2e7d32;
    --warning:#f9a825;
    --radius:10px;
}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    display:flex;flex-direction:column;
}
header{
    background:var(--drk-red);color:var(--white);
    padding:1rem 2rem;display:flex;align-items:center;gap:1rem;
}
.drk-logo{display:flex;align-items:center;gap:.75rem}
.drk-logo svg{flex-shrink:0}
.drk-logo h1{font-size:1.5rem;font-weight:700}
.drk-logo .sub{font-size:.85rem;opacity:.85}
main{flex:1;max-width:900px;width:100%;margin:0 auto;padding:1.5rem 1rem}
.card{background:var(--card);border-radius:var(--radius);padding:1.5rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card h2{font-size:1.2rem;margin-bottom:1rem;color:var(--drk-red)}
.card h3{font-size:1.05rem;margin-bottom:.75rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-weight:600;font-size:.9rem;margin-bottom:.3rem}
input[type=text],input[type=number],textarea{
    width:100%;padding:.6rem .75rem;border:1px solid var(--border);
    border-radius:var(--radius);font-size:.95rem;font-family:inherit;transition:border .2s;
}
input:focus,textarea:focus{outline:none;border-color:var(--drk-red);box-shadow:0 0 0 3px rgba(227,6,19,.12)}
.btn{
    display:inline-block;padding:.6rem 1.25rem;font-size:.95rem;font-weight:600;
    border:none;border-radius:var(--radius);cursor:pointer;font-family:inherit;
    transition:background .2s,transform .1s;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--drk-red);color:var(--white)}
.btn-primary:hover{background:var(--drk-red-dark)}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{background:#ccc}
.btn-danger{background:#c62828;color:var(--white)}
.btn-danger:hover{background:#a11a1a}
.btn-sm{padding:.35rem .7rem;font-size:.85rem}
.hidden{display:none!important}
.badge{
    display:inline-block;background:var(--drk-red);color:var(--white);
    padding:.2rem .7rem;border-radius:999px;font-size:.8rem;font-weight:600;
}
.session-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.session-bar .info{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.session-bar h2{margin-bottom:0}

/* Vote type radios */
.vote-type-select{margin-bottom:1rem}
.vote-type-select>label{font-weight:600;font-size:.9rem;display:block;margin-bottom:.35rem}
.radio-group{display:flex;gap:1.25rem;flex-wrap:wrap}
.radio-label{display:flex;align-items:center;gap:.35rem;font-size:.9rem;cursor:pointer}

/* QR + Progress area */
.vote-live{display:flex;gap:2rem;align-items:flex-start;flex-wrap:wrap;margin:1rem 0}
.qr-area{text-align:center;flex-shrink:0}
.qr-area canvas{border:4px solid var(--drk-red);border-radius:var(--radius)}
.qr-label{font-size:.8rem;color:var(--text-light);margin-top:.5rem}
.progress-area{flex:1;min-width:250px}

/* Progress bars */
.vote-progress-info{font-size:.95rem;color:var(--text-light);margin-bottom:.75rem}
.progress-bar{width:100%;height:10px;background:var(--border);border-radius:999px;overflow:hidden;margin-top:.3rem}
.progress-fill{height:100%;background:var(--drk-red);border-radius:999px;transition:width .4s ease;width:0}

/* Live bars */
.live-bar-group{margin-bottom:.6rem}
.live-bar-label{display:flex;justify-content:space-between;font-size:.9rem;font-weight:600;margin-bottom:.2rem}
.live-bar-track{width:100%;height:24px;background:var(--border);border-radius:var(--radius);overflow:hidden}
.live-bar-fill{height:100%;border-radius:var(--radius);transition:width .4s ease;min-width:0}
.live-bar-fill.ja{background:var(--success)}
.live-bar-fill.nein{background:#c62828}
.live-bar-fill.enthaltung{background:var(--warning)}
.live-bar-fill.custom{background:var(--drk-red)}

/* Result */
.result-bar-group{margin-bottom:.75rem}
.result-bar-label{display:flex;justify-content:space-between;font-size:.95rem;font-weight:600;margin-bottom:.25rem}
.result-bar-track{width:100%;height:32px;background:var(--border);border-radius:var(--radius);overflow:hidden}
.result-bar-fill{height:100%;border-radius:var(--radius);transition:width .6s ease}
.result-bar-fill.ja{background:var(--success)}
.result-bar-fill.nein{background:#c62828}
.result-bar-fill.enthaltung{background:var(--warning)}
.result-bar-fill.custom{background:var(--drk-red)}

.result-summary{
    margin-top:1.25rem;padding:1rem;border-radius:var(--radius);
    font-weight:700;text-align:center;font-size:1.3rem;
}
.result-summary.accepted{background:#e8f5e9;color:#1b5e20}
.result-summary.rejected{background:#ffebee;color:#b71c1c}
.result-summary.neutral{background:#f5f5f5;color:var(--text)}

.vote-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem}

/* History */
.history-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:.75rem;background:var(--bg);border-radius:var(--radius);
    flex-wrap:wrap;gap:.5rem;margin-bottom:.5rem;
}
.history-topic{font-weight:600;font-size:.95rem}
.history-result{
    font-size:.8rem;padding:.2rem .6rem;border-radius:999px;font-weight:600;
}
.history-result.accepted{background:#e8f5e9;color:#1b5e20}
.history-result.rejected{background:#ffebee;color:#b71c1c}
.history-result.neutral{background:#eee;color:var(--text)}
.history-details{width:100%;font-size:.85rem;color:var(--text-light)}

.empty-state{text-align:center;color:var(--text-light);padding:1rem;font-style:italic}

footer{text-align:center;padding:1rem;color:var(--text-light);font-size:.8rem}

@media(max-width:600px){
    header{padding:.75rem 1rem}
    .drk-logo h1{font-size:1.2rem}
    main{padding:1rem .5rem}
    .card{padding:1rem}
    .vote-live{flex-direction:column;align-items:center}
    .session-bar{flex-direction:column;align-items:flex-start;gap:.75rem}
}
    </style>
</head>
<body>
<header>
    <div class="drk-logo">
        <svg viewBox="0 0 44 44" width="40" height="40">
            <circle cx="22" cy="22" r="21" fill="white"/>
            <rect x="18" y="6" width="8" height="32" rx="1.5" fill="#e30613"/>
            <rect x="6" y="18" width="32" height="8" rx="1.5" fill="#e30613"/>
        </svg>
        <div>
            <h1>DRK Vereinsabstimmung</h1>
            <div class="sub">Digitales Abstimmungssystem</div>
        </div>
    </div>
</header>

<main>
    <!-- ====== SETUP ====== -->
    <section id="setup" class="card">
        <h2>Sitzung einrichten</h2>
        <div class="form-group">
            <label for="inp-title">Sitzungstitel</label>
            <input type="text" id="inp-title" placeholder="z.B. Jahreshauptversammlung 2026">
        </div>
        <div class="form-group">
            <label for="inp-voters">Anzahl Stimmberechtigte</label>
            <input type="number" id="inp-voters" min="1" value="10">
        </div>
        <button class="btn btn-primary" id="btn-start-session">Sitzung starten</button>
    </section>

    <!-- ====== ACTIVE SESSION ====== -->
    <section id="session" class="hidden">
        <div class="card session-bar">
            <div class="info">
                <h2 id="lbl-title"></h2>
                <span class="badge" id="lbl-voters"></span>
            </div>
            <button class="btn btn-danger btn-sm" id="btn-end-session">Sitzung beenden</button>
        </div>

        <!-- New Vote Form -->
        <div id="sec-new-vote" class="card">
            <h3>Neue Abstimmung</h3>
            <div class="form-group">
                <label for="inp-topic">Thema / Antrag</label>
                <input type="text" id="inp-topic" placeholder="z.B. Erhöhung des Mitgliedsbeitrags">
            </div>
            <div class="form-group">
                <label for="inp-desc">Beschreibung (optional)</label>
                <textarea id="inp-desc" rows="2" placeholder="Details zum Antrag..."></textarea>
            </div>
            <div class="vote-type-select">
                <label>Abstimmungsart:</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="vtype" value="yes-no" checked> Ja / Nein / Enthaltung</label>
                    <label class="radio-label"><input type="radio" name="vtype" value="custom"> Eigene Optionen</label>
                </div>
            </div>
            <div id="custom-opts" class="hidden">
                <div class="form-group">
                    <label>Optionen (eine pro Zeile)</label>
                    <textarea id="inp-custom" rows="3" placeholder="Option A&#10;Option B&#10;Option C"></textarea>
                </div>
            </div>
            <button class="btn btn-primary" id="btn-start-vote">Abstimmung starten</button>
        </div>

        <!-- Active Vote -->
        <div id="sec-active-vote" class="card hidden">
            <h3 id="lbl-vote-topic"></h3>
            <p id="lbl-vote-desc" style="color:var(--text-light);font-size:.9rem;margin-bottom:1rem"></p>

            <div class="vote-live">
                <div class="qr-area">
                    <canvas id="qr-canvas"></canvas>
                    <div class="qr-label">QR-Code scannen zum Abstimmen</div>
                </div>
                <div class="progress-area">
                    <div class="vote-progress-info">
                        <strong><span id="lbl-cast">0</span></strong> von <strong><span id="lbl-total">0</span></strong> Stimmen abgegeben
                        <div class="progress-bar"><div class="progress-fill" id="bar-progress"></div></div>
                    </div>
                    <div id="live-bars"></div>
                </div>
            </div>

            <div class="vote-actions">
                <button class="btn btn-primary" id="btn-close-vote">Abstimmung schließen</button>
                <button class="btn btn-secondary" id="btn-cancel-vote">Abbrechen</button>
            </div>
        </div>

        <!-- Result -->
        <div id="sec-result" class="card hidden">
            <h2 style="color:var(--text)">Ergebnis</h2>
            <h3 id="lbl-result-topic"></h3>
            <div id="result-bars" style="margin-top:1rem"></div>
            <div id="result-summary" class="result-summary"></div>
            <div class="vote-actions" style="margin-top:1.25rem">
                <button class="btn btn-primary" id="btn-next-vote">Nächste Abstimmung</button>
            </div>
        </div>

        <!-- History -->
        <div id="sec-history" class="card">
            <h3>Bisherige Abstimmungen</h3>
            <div id="history-list">
                <p class="empty-state">Noch keine Abstimmungen durchgeführt.</p>
            </div>
        </div>
    </section>
</main>

<footer>DRK Vereinsabstimmung &mdash; Deutsches Rotes Kreuz</footer>

<script>
(function(){
    "use strict";

    var sessionCode = null;
    var sessionIP = null;
    var sessionPort = null;
    var currentVote = null;
    var history = [];
    var evtSource = null;

    // Elements
    var $ = function(id){ return document.getElementById(id); };
    var el = {
        setup: $("setup"),
        session: $("session"),
        inpTitle: $("inp-title"),
        inpVoters: $("inp-voters"),
        btnStartSession: $("btn-start-session"),
        lblTitle: $("lbl-title"),
        lblVoters: $("lbl-voters"),
        btnEndSession: $("btn-end-session"),
        secNewVote: $("sec-new-vote"),
        inpTopic: $("inp-topic"),
        inpDesc: $("inp-desc"),
        customOpts: $("custom-opts"),
        inpCustom: $("inp-custom"),
        btnStartVote: $("btn-start-vote"),
        secActiveVote: $("sec-active-vote"),
        lblVoteTopic: $("lbl-vote-topic"),
        lblVoteDesc: $("lbl-vote-desc"),
        qrCanvas: $("qr-canvas"),
        lblCast: $("lbl-cast"),
        lblTotal: $("lbl-total"),
        barProgress: $("bar-progress"),
        liveBars: $("live-bars"),
        btnCloseVote: $("btn-close-vote"),
        btnCancelVote: $("btn-cancel-vote"),
        secResult: $("sec-result"),
        lblResultTopic: $("lbl-result-topic"),
        resultBars: $("result-bars"),
        resultSummary: $("result-summary"),
        btnNextVote: $("btn-next-vote"),
        historyList: $("history-list"),
    };

    // Vote type radios
    document.querySelectorAll('input[name="vtype"]').forEach(function(r){
        r.addEventListener("change", function(){
            el.customOpts.classList.toggle("hidden", this.value !== "custom");
        });
    });

    // ---- API helpers ----
    function api(method, path, body){
        var opts = { method: method, headers: {"Content-Type":"application/json"} };
        if(body) opts.body = JSON.stringify(body);
        return fetch(path, opts).then(function(r){ return r.json(); });
    }

    // ---- Start session ----
    el.btnStartSession.addEventListener("click", function(){
        var title = el.inpTitle.value.trim();
        var voters = parseInt(el.inpVoters.value, 10);
        if(!title){ alert("Bitte Sitzungstitel eingeben."); return; }
        if(!voters||voters<1){ alert("Bitte gültige Anzahl eingeben."); return; }

        api("POST", "/api/session", {title:title, voters:voters}).then(function(data){
            sessionCode = data.code;
            sessionIP = data.ip;
            sessionPort = data.port;
            history = [];

            el.lblTitle.textContent = title;
            el.lblVoters.textContent = voters + " Stimmberechtigte";
            el.setup.classList.add("hidden");
            el.session.classList.remove("hidden");
            showNewVote();
            connectSSE();
        });
    });

    // ---- End session ----
    el.btnEndSession.addEventListener("click", function(){
        if(!confirm("Sitzung wirklich beenden?")) return;
        api("POST", "/api/end/" + sessionCode);
        if(evtSource) evtSource.close();
        sessionCode = null;
        history = [];
        el.session.classList.add("hidden");
        el.setup.classList.remove("hidden");
        el.inpTitle.value = "";
        el.inpVoters.value = "10";
    });

    // ---- SSE ----
    function connectSSE(){
        if(evtSource) evtSource.close();
        evtSource = new EventSource("/api/events/" + sessionCode);

        evtSource.addEventListener("vote-update", function(e){
            var data = JSON.parse(e.data);
            if(currentVote){
                currentVote.totalCast = data.totalCast;
                currentVote.votes = data.votes;
                updateLiveBars();
            }
        });

        evtSource.addEventListener("vote-closed", function(e){
            var result = JSON.parse(e.data);
            history.push(result);
            currentVote = null;
            showResult(result);
            updateHistory();
        });
    }

    // ---- Start vote ----
    el.btnStartVote.addEventListener("click", function(){
        var topic = el.inpTopic.value.trim();
        if(!topic){ alert("Bitte Thema eingeben."); return; }

        var desc = el.inpDesc.value.trim();
        var vtype = document.querySelector('input[name="vtype"]:checked').value;
        var body = { topic:topic, description:desc, type:vtype };

        if(vtype === "custom"){
            var raw = el.inpCustom.value.trim();
            if(!raw){ alert("Bitte Optionen eingeben."); return; }
            var opts = raw.split("\n").map(function(s){return s.trim()}).filter(function(s){return s.length>0});
            if(opts.length<2){ alert("Mindestens 2 Optionen nötig."); return; }
            body.options = opts;
        }

        api("POST", "/api/vote/" + sessionCode, body).then(function(){
            var options = vtype==="custom" ? body.options : ["Ja","Nein","Enthaltung"];
            var votes = {};
            options.forEach(function(o){votes[o]=0});
            currentVote = { topic:topic, description:desc, type:vtype, options:options, votes:votes, totalCast:0 };
            showActiveVote();
        });
    });

    // ---- Close vote ----
    el.btnCloseVote.addEventListener("click", function(){
        if(!currentVote || currentVote.totalCast===0){
            alert("Es wurde noch keine Stimme abgegeben."); return;
        }
        api("POST", "/api/close/" + sessionCode);
    });

    el.btnCancelVote.addEventListener("click", function(){
        if(!confirm("Abstimmung wirklich abbrechen?")) return;
        api("POST", "/api/close/" + sessionCode).then(function(){
            showNewVote();
        });
    });

    el.btnNextVote.addEventListener("click", showNewVote);

    // ---- UI ----
    function showNewVote(){
        el.secNewVote.classList.remove("hidden");
        el.secActiveVote.classList.add("hidden");
        el.secResult.classList.add("hidden");
        el.inpTopic.value = "";
        el.inpDesc.value = "";
        el.inpCustom.value = "";
        document.querySelector('input[name="vtype"][value="yes-no"]').checked = true;
        el.customOpts.classList.add("hidden");
        currentVote = null;
    }

    function showActiveVote(){
        el.secNewVote.classList.add("hidden");
        el.secResult.classList.add("hidden");
        el.secActiveVote.classList.remove("hidden");

        el.lblVoteTopic.textContent = currentVote.topic;
        el.lblVoteDesc.textContent = currentVote.description || "";
        el.lblTotal.textContent = el.inpVoters.value || "?";

        // QR code
        var voteURL = "http://" + sessionIP + ":" + sessionPort + "/vote/" + sessionCode;
        QRCode.toCanvas(el.qrCanvas, voteURL, {
            width: 220,
            margin: 2,
            color: { dark:"#e30613", light:"#ffffff" }
        });

        updateLiveBars();
    }

    function updateLiveBars(){
        if(!currentVote) return;
        var cast = currentVote.totalCast;
        var total = parseInt(el.inpVoters.value)||1;

        el.lblCast.textContent = cast;
        el.barProgress.style.width = (cast/total*100) + "%";

        var html = "";
        currentVote.options.forEach(function(opt){
            var count = currentVote.votes[opt] || 0;
            var pct = cast > 0 ? (count/cast*100) : 0;
            var cls = barClass(opt, currentVote.type);
            html += '<div class="live-bar-group">' +
                '<div class="live-bar-label"><span>'+esc(opt)+'</span><span>'+count+'</span></div>' +
                '<div class="live-bar-track"><div class="live-bar-fill '+cls+'" style="width:'+pct+'%"></div></div>' +
                '</div>';
        });
        el.liveBars.innerHTML = html;
    }

    function showResult(result){
        el.secActiveVote.classList.add("hidden");
        el.secResult.classList.remove("hidden");
        el.lblResultTopic.textContent = result.topic;

        var html = "";
        result.options.forEach(function(opt){
            var count = result.votes[opt]||0;
            var pct = result.totalCast>0 ? (count/result.totalCast*100) : 0;
            var cls = barClass(opt, result.type);
            html += '<div class="result-bar-group">' +
                '<div class="result-bar-label"><span>'+esc(opt)+'</span><span>'+count+' ('+Math.round(pct)+'%)</span></div>' +
                '<div class="result-bar-track"><div class="result-bar-fill '+cls+'" style="width:'+pct+'%"></div></div>' +
                '</div>';
        });
        el.resultBars.innerHTML = html;

        el.resultSummary.className = "result-summary";
        if(result.outcome==="accepted"){
            el.resultSummary.textContent = "Antrag ANGENOMMEN";
            el.resultSummary.classList.add("accepted");
        } else if(result.outcome==="rejected"){
            el.resultSummary.textContent = "Antrag ABGELEHNT";
            el.resultSummary.classList.add("rejected");
        } else if(result.outcome==="tie"){
            el.resultSummary.textContent = "STIMMENGLEICHHEIT";
            el.resultSummary.classList.add("neutral");
        } else {
            el.resultSummary.textContent = "Gewinner: " + (result.winner||"");
            el.resultSummary.classList.add("accepted");
        }
    }

    function updateHistory(){
        if(history.length===0){
            el.historyList.innerHTML = '<p class="empty-state">Noch keine Abstimmungen durchgeführt.</p>';
            return;
        }
        var html = "";
        history.forEach(function(item, i){
            var rClass, rText;
            if(item.outcome==="accepted"){ rClass="accepted"; rText="Angenommen"; }
            else if(item.outcome==="rejected"){ rClass="rejected"; rText="Abgelehnt"; }
            else if(item.outcome==="tie"){ rClass="neutral"; rText="Gleichstand"; }
            else { rClass="accepted"; rText=item.winner||"Gewinner"; }

            var details = item.options.map(function(o){return o+": "+item.votes[o]}).join(" | ");
            details += " (Gesamt: "+item.totalCast+"/"+item.totalVoters+")";

            html += '<div class="history-item">' +
                '<span class="history-topic">'+(i+1)+'. '+esc(item.topic)+'</span>' +
                '<span class="history-result '+rClass+'">'+rText+'</span>' +
                '<div class="history-details">'+esc(details)+'</div>' +
                '</div>';
        });
        el.historyList.innerHTML = html;
    }

    function barClass(option, type){
        if(type==="yes-no"){
            if(option==="Ja") return "ja";
            if(option==="Nein") return "nein";
            return "enthaltung";
        }
        return "custom";
    }

    function esc(s){
        var d = document.createElement("div");
        d.appendChild(document.createTextNode(s));
        return d.innerHTML;
    }
})();
</script>
</body>
</html>
